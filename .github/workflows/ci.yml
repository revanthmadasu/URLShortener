name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit tests (fast, no Docker). Fails the build on any unit-test regression.
      - name: Unit tests
        run: ./mvnw -B test

      # Integration tests use Testcontainers; GitHub-hosted Ubuntu runners ship Docker.
      # `verify` also runs the quality gates (Spotless, SpotBugs, JaCoCo coverage) that
      # are wired in Phase 4. Kept as one command so the gate set is the source of truth.
      - name: Verify (integration tests + quality gates)
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**
          if-no-files-found: ignore
